<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪜 사다리타기 — 뽑기 왕국</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #0d0f1a;
      --bg2:        #131628;
      --bg3:        #1a1e35;
      --sb:         #10121f;
      --accent:     #f5c842;
      --accent2:    #ff6b35;
      --accent3:    #4ecdc4;
      --red:        #e84040;
      --blue:       #378ADD;
      --text:       #eeeef5;
      --muted:      #8890b0;
      --faint:      #4a5070;
      --border:     rgba(255,255,255,0.07);
      --r:          12px;
      --rlg:        16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.35}
    .blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;animation:blobFloat 14s ease-in-out infinite alternate}
    .b1{width:420px;height:420px;background:rgba(245,200,66,.07);top:-80px;right:-60px}
    .b2{width:360px;height:360px;background:rgba(255,107,53,.06);bottom:60px;left:-80px;animation-delay:-6s}
    .b3{width:260px;height:260px;background:rgba(78,205,196,.05);top:35%;left:35%;animation-delay:-10s}
    @keyframes blobFloat{from{transform:translate(0,0) scale(1)}to{transform:translate(24px,16px) scale(1.07)}}

    /* ── APP LAYOUT ── */
    #app{position:relative;z-index:1;display:flex;width:100vw;height:100vh}

    /* ── SIDEBAR ── */
    #sb{width:260px;min-width:260px;height:100%;background:var(--sb);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .sb-nav{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
    .back{display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;transition:all .15s;flex-shrink:0}
    .back:hover{background:rgba(255,255,255,.1);color:var(--text)}
    .sb-logo{font-family:'Gmarket Sans',sans-serif;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none}
    .sb-logo span{color:var(--muted);font-weight:300}
    .sb-body{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
    .sb-body::-webkit-scrollbar{width:4px}
    .sb-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
    .title-block{display:flex;align-items:center;gap:10px}
    .title-icon{font-size:26px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
    .title-text{font-family:'Gmarket Sans',sans-serif;font-size:16px;font-weight:700;color:var(--text)}
    .title-sub{font-size:11px;color:var(--muted);margin-top:1px}
    .slabel{font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
    .sdivider{height:1px;background:var(--border)}
    textarea{width:100%;font-size:12px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg3);color:var(--text);resize:none;line-height:1.6;font-family:'Noto Sans KR',sans-serif;transition:border-color .15s}
    textarea:focus{outline:none;border-color:rgba(245,200,66,.4)}
    textarea::placeholder{color:var(--faint)}
    .hint{font-size:10px;color:var(--faint);margin-top:4px}

    /* mode tabs */
    .tabs{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:3px;gap:3px}
    .tab{flex:1;text-align:center;font-size:11px;font-weight:700;font-family:'Gmarket Sans',sans-serif;padding:6px 4px;border-radius:9px;cursor:pointer;color:var(--muted);transition:all .15s}
    .tab.active{background:rgba(245,200,66,.18);color:var(--accent)}

    /* sub-mode badges */
    .badges{display:flex;gap:5px;flex-wrap:wrap}
    .badge{font-size:11px;padding:3px 10px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--muted);cursor:pointer;transition:all .15s}
    .badge:hover{border-color:rgba(245,200,66,.3);color:var(--text)}
    .badge.active{background:rgba(245,200,66,.15);color:var(--accent);border-color:rgba(245,200,66,.4)}

    /* number row */
    .nrow{display:flex;align-items:center;gap:8px}
    .nrow label{font-size:12px;color:var(--muted);flex:1}
    .ninput{width:60px;text-align:center;font-size:14px;font-weight:700;padding:5px 4px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg3);color:var(--accent);font-family:'Gmarket Sans',sans-serif;transition:border-color .15s}
    .ninput:focus{outline:none;border-color:rgba(245,200,66,.4)}
    .ninput::-webkit-inner-spin-button,.ninput::-webkit-outer-spin-button{opacity:1}

    /* speed row */
    .srow{display:flex;align-items:center;gap:8px}
    .srow .sv{font-size:12px;font-weight:700;min-width:36px;text-align:right;color:var(--blue);font-family:'Gmarket Sans',sans-serif}
    input[type=range]{flex:1;accent-color:var(--blue)}

    /* key hint */
    .keyhint{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:11px;color:var(--muted)}
    .kbadge{font-size:10px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:1px 6px;color:var(--text);font-family:'Gmarket Sans',sans-serif;white-space:nowrap}

    /* start btn */
    #start-btn{width:100%;padding:12px;font-size:14px;font-weight:700;font-family:'Gmarket Sans',sans-serif;background:linear-gradient(135deg,#f5c842,#ff6b35);color:#0d0f1a;border:none;border-radius:var(--r);cursor:pointer;transition:opacity .15s,transform .1s}
    #start-btn:hover{opacity:.88;transform:translateY(-1px)}
    #start-btn:active{transform:translateY(0)}
    .sb-foot{padding:0 18px 18px;flex-shrink:0}

    /* ── MAIN ── */
    #main{flex:1;height:100%;position:relative;background:var(--bg2);overflow:hidden;display:flex;flex-direction:column}

    /* idle */
    #idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
    .idle-icon{font-size:64px;filter:drop-shadow(0 8px 24px rgba(78,205,196,.3))}
    .idle-title{font-family:'Gmarket Sans',sans-serif;font-size:20px;font-weight:700;color:var(--text)}
    .idle-sub{font-size:13px;color:var(--muted)}

    /* game container */
    #game{display:none;width:100%;height:100%;flex-direction:column}

    /* top name row */
    #top-row{display:flex;justify-content:space-between;align-items:flex-end;padding:16px 16px 0;flex-shrink:0;gap:6px}
    .pname{
      font-family:'Gmarket Sans',sans-serif;font-size:13px;font-weight:700;
      padding:6px 10px;border-radius:var(--r);border:1px solid var(--border);
      background:var(--bg3);color:var(--text);cursor:pointer;text-align:center;
      transition:all .2s;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;
      flex:1;
    }
    .pname:hover{border-color:rgba(245,200,66,.4);color:var(--accent)}
    .pname.running{border-color:rgba(245,200,66,.6);color:var(--accent);background:rgba(245,200,66,.1)}
    .pname.done-win{border-color:rgba(245,200,66,.8);color:var(--accent);background:rgba(245,200,66,.15)}
    .pname.done-lose{border-color:var(--faint);color:var(--faint);background:transparent}
    .pname.selected-pending{border-color:rgba(78,205,196,.6);color:var(--accent3);background:rgba(78,205,196,.1)}

    /* canvas */
    #ladder-canvas{flex:1;width:100%;display:block}

    /* bottom result row */
    #bot-row{display:flex;justify-content:space-between;align-items:flex-start;padding:0 16px 12px;flex-shrink:0;gap:6px}
    .rname{
      font-family:'Gmarket Sans',sans-serif;font-size:12px;font-weight:700;
      padding:5px 8px;border-radius:var(--r);border:1px solid var(--border);
      background:var(--bg3);color:var(--muted);text-align:center;
      white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;
      flex:1;transition:all .3s;
    }
    .rname.win{border-color:rgba(245,200,66,.7);color:var(--accent);background:rgba(245,200,66,.12)}
    .rname.lose{border-color:var(--faint);color:var(--faint)}

    /* help bar */
    #help-bar{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
      display:flex;align-items:center;gap:10px;
      background:rgba(13,15,26,.8);backdrop-filter:blur(12px);
      border:1px solid var(--border);border-radius:40px;
      padding:7px 18px;font-size:12px;color:var(--muted);white-space:nowrap;
      transition:opacity .3s;pointer-events:none;
    }
    #help-bar .kb{font-size:10px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:1px 7px;color:var(--text);font-family:'Gmarket Sans',sans-serif}

    /* result overlay */
    #result-overlay{position:absolute;inset:0;background:rgba(5,7,18,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:20}
    #result-box{background:var(--bg2);border:1px solid rgba(245,200,66,.2);border-radius:var(--rlg);padding:36px 48px;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,.6);animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both;min-width:320px;max-width:500px}
    @keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
    .res-icon{font-size:52px;margin-bottom:10px}
    .res-title{font-family:'Gmarket Sans',sans-serif;font-size:20px;font-weight:700;color:var(--accent);margin-bottom:16px}
    .res-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;text-align:left;max-height:260px;overflow-y:auto}
    .res-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);background:var(--bg3);border:1px solid var(--border)}
    .res-item.win{border-color:rgba(245,200,66,.3);background:rgba(245,200,66,.07)}
    .res-player{font-family:'Gmarket Sans',sans-serif;font-size:13px;font-weight:700;color:var(--text);flex:1}
    .res-arrow{color:var(--faint);font-size:12px}
    .res-result{font-size:13px;font-weight:700;font-family:'Gmarket Sans',sans-serif}
    .res-result.win{color:var(--accent)}
    .res-result.lose{color:var(--faint)}
    .res-btns{display:flex;gap:10px;justify-content:center}
    .btn-p{padding:10px 24px;font-size:13px;font-weight:700;font-family:'Gmarket Sans',sans-serif;background:linear-gradient(135deg,#f5c842,#ff6b35);color:#0d0f1a;border:none;border-radius:var(--r);cursor:pointer;transition:opacity .15s}
    .btn-p:hover{opacity:.85}
    .btn-s{padding:10px 20px;font-size:13px;font-weight:500;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:all .15s;font-family:'Noto Sans KR',sans-serif}
    .btn-s:hover{background:rgba(255,255,255,.1);color:var(--text)}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  
    /* ── participant save/load ── */
    .p-btns { display: flex; gap: 6px; margin-top: 6px; }
    .p-btn {
      flex: 1; font-size: 11px; font-weight: 700;
      font-family: 'Gmarket Sans', sans-serif;
      padding: 5px 0; border-radius: 8px; cursor: pointer;
      transition: all .15s; border: 1px solid;
    }
    .p-btn-save {
      background: rgba(245,200,66,.12); color: #f5c842;
      border-color: rgba(245,200,66,.35);
    }
    .p-btn-save:hover { background: rgba(245,200,66,.22); }
    .p-btn-load {
      background: rgba(78,205,196,.1); color: #4ecdc4;
      border-color: rgba(78,205,196,.3);
    }
    .p-btn-load:hover { background: rgba(78,205,196,.2); }

    /* modal backdrop */
    #plist-modal {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(5,7,18,.8); backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
    }
    #plist-box {
      background: #131628; border: 1px solid rgba(245,200,66,.2);
      border-radius: 16px; padding: 24px 24px 20px;
      width: 340px; max-width: 90vw;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
      animation: pmIn .25s cubic-bezier(.34,1.4,.64,1) both;
    }
    @keyframes pmIn { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }
    #plist-title {
      font-family: 'Gmarket Sans', sans-serif; font-size: 15px; font-weight: 700;
      color: #eeeef5; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #plist-close {
      cursor: pointer; font-size: 18px; color: #8890b0; line-height: 1;
      background: none; border: none; padding: 0;
    }
    #plist-close:hover { color: #eeeef5; }
    /* save form */
    #plist-save-row {
      display: flex; gap: 6px; margin-bottom: 12px;
    }
    #plist-name-input {
      flex: 1; font-size: 12px; padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
      background: #1a1e35; color: #eeeef5;
      font-family: 'Noto Sans KR', sans-serif;
    }
    #plist-name-input:focus { outline: none; border-color: rgba(245,200,66,.4); }
    #plist-do-save {
      font-size: 11px; font-weight: 700; padding: 6px 12px;
      background: linear-gradient(135deg,#f5c842,#ff6b35); color: #0d0f1a;
      border: none; border-radius: 8px; cursor: pointer;
      font-family: 'Gmarket Sans', sans-serif;
    }
    #plist-do-save:hover { opacity: .85; }
    /* list */
    #plist-empty {
      font-size: 12px; color: #4a5070; text-align: center;
      padding: 20px 0;
    }
    .plist-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.07);
      background: #1a1e35; margin-bottom: 6px;
      cursor: pointer; transition: all .15s;
    }
    .plist-item:hover { border-color: rgba(245,200,66,.35); background: rgba(245,200,66,.06); }
    .plist-item-info { flex: 1; min-width: 0; }
    .plist-item-name {
      font-family: 'Gmarket Sans', sans-serif; font-size: 13px; font-weight: 700;
      color: #eeeef5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .plist-item-preview {
      font-size: 10px; color: #8890b0; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .plist-item-del {
      font-size: 14px; color: #4a5070; background: none; border: none;
      cursor: pointer; padding: 2px 4px; border-radius: 5px; flex-shrink: 0;
    }
    .plist-item-del:hover { color: #e84040; background: rgba(232,64,64,.1); }
    #plist-scroll { max-height: 240px; overflow-y: auto; }
    #plist-scroll::-webkit-scrollbar { width: 4px; }
    #plist-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }

  </style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div id="app">
<!-- ── SIDEBAR ── -->
<div id="sb">
  <div class="sb-nav">
    <a class="back" href="index.html">←</a>
    <a class="sb-logo" href="index.html">🎲 뽑기왕국 <span>/ 사다리</span></a>
  </div>
  <div class="sb-body">

    <div class="title-block">
      <div class="title-icon">🪜</div>
      <div><div class="title-text">사다리타기</div><div class="title-sub">운명의 사다리!</div></div>
    </div>

    <div class="sdivider"></div>

    <!-- 참가자 -->
    <div>
      <div class="slabel">참가자</div>
      <textarea id="players-ta" rows="3" placeholder="쉼표로 구분&#10;예) 철수,영희,민준,수아">철수,영희,민준,수아,지호</textarea>
        <div class="p-btns">
          <button class="p-btn p-btn-save" onclick="pSave()">💾 참가자 저장</button>
          <button class="p-btn p-btn-load" onclick="pOpenModal()">📂 불러오기</button>
        </div>
    </div>

    <!-- 모드 -->
    <div>
      <div class="slabel">방식</div>
      <div class="tabs">
        <div class="tab active" data-mode="win">🏆 당첨 방식</div>
        <div class="tab" data-mode="result">🎯 선택지 방식</div>
      </div>
    </div>

    <!-- 당첨 방식 설정 -->
    <div id="win-section">
      <div class="slabel">당첨 개수</div>
      <div class="badges" id="win-mode-badges">
        <div class="badge active" data-wm="manual">직접 입력</div>
        <div class="badge" data-wm="random">랜덤 (숨김)</div>
      </div>
      <div id="win-manual" style="margin-top:10px">
        <div class="nrow">
          <label>당첨 수</label>
          <input type="number" id="win-count" class="ninput" min="1" max="9" value="1">
        </div>
        <div class="hint" id="win-hint">1 ~ 참가자수-1 이하</div>
      </div>
      <div id="win-random-note" style="display:none;margin-top:8px;font-size:11px;color:var(--muted);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;line-height:1.6">
        🎲 당첨 개수가 숨겨집니다.<br>내려가봐야 알 수 있어요!
      </div>
    </div>

    <!-- 선택지 방식 설정 -->
    <div id="result-section" style="display:none">
      <div class="slabel">선택지</div>
      <textarea id="results-ta" rows="3" placeholder="쉼표로 구분&#10;예) 치킨,피자,삼겹살&#10;(참가자보다 적으면 나머지는 꽝)">치킨,피자,삼겹살</textarea>
      <div class="hint">참가자 수보다 적으면 나머지는 꽝</div>
    </div>

    <!-- 속도 -->
    <div>
      <div class="slabel">이동 속도</div>
      <div class="srow">
        <span style="font-size:11px;color:var(--faint)">느림</span>
        <input type="range" id="speed-range" min="1" max="100" value="50" step="1">
        <span style="font-size:11px;color:var(--faint)">빠름</span>
        <span class="sv" id="speed-val">5</span>
      </div>
    </div>

    <!-- 키 힌트 -->
    <div class="keyhint">
      <span class="kbadge">SPACE</span><span>배속</span>
      <span style="color:var(--faint)">·</span>
      <span class="kbadge">ENTER</span><span>전체 출발</span>
    </div>

  </div>
  <div class="sb-foot"><button id="start-btn">🎮 게임 시작</button></div>
</div>

<!-- ── MAIN ── -->
<div id="main">
  <div id="idle">
    <div class="idle-icon">🪜</div>
    <div class="idle-title">사다리타기</div>
    <div class="idle-sub">참가자를 입력하고 게임을 시작하세요</div>
  </div>

  <div id="game">
    <div id="top-row"></div>
    <canvas id="ladder-canvas"></canvas>
    <div id="bot-row"></div>
  </div>

  <div id="help-bar">
    <span class="kb">클릭</span><span>개별 출발</span>
    <span style="color:var(--faint)">·</span>
    <span class="kb">ENTER</span><span>전체 출발</span>
    <span style="color:var(--faint)">·</span>
    <span class="kb">SPACE</span><span>배속</span>
  </div>

  <div id="result-overlay" style="display:none">
    <div id="result-box">
      <div class="res-icon" id="res-icon">🎉</div>
      <div class="res-title" id="res-title">결과 발표</div>
      <div class="res-list" id="res-list"></div>
      <div class="res-btns">
        <button class="btn-p" id="replay-btn">🔄 다시 하기</button>
        <a href="index.html" class="btn-s">🏠 홈으로</a>
      </div>
    </div>
  </div>
</div>
</div>

<script>
/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let gameMode    = 'win';   // 'win' | 'result'
let winMode     = 'manual';
let speedLevel  = 50;
let spaceDown   = false;
let gameRunning = false;
let gameFinished= false;

const canvas  = document.getElementById('ladder-canvas');
const ctx     = canvas.getContext('2d');

/* ladder data */
let players   = [];   // string[]
let outcomes  = [];   // string[] — bottom labels
let ladderRungs = []; // [{col, row}] horizontal bars
let cols      = 0;
let ROWS      = 0;

/* animation */
let walkers   = [];  /* {pi, x, y, col, row, going:'down'|'left'|'right', stepFrac, done, won} */
let animId    = null;
let lastTs    = null;

/* layout constants — computed in buildLayout */
let colW, rowH, topPad, botPad, sidePad;
let colXArr = []; /* actual X positions read from DOM name cards */

/* ═══════════════════════════════════════════
   SIDEBAR WIRING
═══════════════════════════════════════════ */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  gameMode = t.dataset.mode;
  document.getElementById('win-section').style.display    = gameMode==='win'    ? '' : 'none';
  document.getElementById('result-section').style.display = gameMode==='result' ? '' : 'none';
}));

document.querySelectorAll('[data-wm]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-wm]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  winMode = b.dataset.wm;
  document.getElementById('win-manual').style.display     = winMode==='manual' ? '' : 'none';
  document.getElementById('win-random-note').style.display= winMode==='random' ? '' : 'none';
}));

document.getElementById('players-ta').addEventListener('input', updateWinMax);
document.getElementById('win-count').addEventListener('input', () => {
  let v = parseInt(document.getElementById('win-count').value);
  const max = Math.max(1, parsePlayers().length - 1);
  if (isNaN(v)||v<1) v=1; if (v>max) v=max;
  document.getElementById('win-count').value = v;
});
document.getElementById('speed-range').addEventListener('input', e => {
  speedLevel = parseInt(e.target.value);
  document.getElementById('speed-val').textContent = speedLevel;
});

function parsePlayers(){ return document.getElementById('players-ta').value.split(',').map(s=>s.trim()).filter(Boolean); }
function parseResults(){ return document.getElementById('results-ta').value.split(',').map(s=>s.trim()).filter(Boolean); }
function updateWinMax(){
  const max = Math.max(1, parsePlayers().length-1);
  document.getElementById('win-count').max = max;
  document.getElementById('win-hint').textContent = `1 ~ ${max} 이하`;
  let v = parseInt(document.getElementById('win-count').value);
  if (isNaN(v)||v<1) v=1; if (v>max) v=max;
  document.getElementById('win-count').value = v;
}
updateWinMax();

/* ═══════════════════════════════════════════
   BUILD GAME
═══════════════════════════════════════════ */
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('replay-btn').addEventListener('click', () => {
  document.getElementById('result-overlay').style.display = 'none';
  startGame();
});

function startGame(){
  players = parsePlayers();
  if (players.length < 2){ alert('참가자를 2명 이상 입력하세요.'); return; }

  /* shuffle players */
  players = shuffle([...players]);

  /* build outcomes array */
  if (gameMode === 'win'){
    const n = players.length;
    let wCount;
    if (winMode === 'random') wCount = Math.floor(Math.random()*(n-1))+1;
    else { wCount = parseInt(document.getElementById('win-count').value)||1; if(wCount>=n) wCount=n-1; }
    outcomes = shuffle([...Array(wCount).fill('당첨'), ...Array(n-wCount).fill('꽝')]);
  } else {
    const raw = parseResults();
    const n   = players.length;
    const res = raw.slice(0, n);
    while(res.length < n) res.push('꽝');
    outcomes = shuffle(res);
  }

  cols = players.length;
  buildLayout();
  generateRungs();
  buildWalkers();
  buildUI();

  document.getElementById('idle').style.display   = 'none';
  document.getElementById('game').style.display   = 'flex';
  document.getElementById('result-overlay').style.display = 'none';
  document.getElementById('help-bar').style.opacity = '1';

  gameRunning  = true;
  gameFinished = false;
  lastTs = null;
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(gameLoop);
}

/* ── layout ── */
function buildLayout(){
  const main    = document.getElementById('main');
  const canvasEl= document.getElementById('ladder-canvas');
  const topRow  = document.getElementById('top-row');
  const botRow  = document.getElementById('bot-row');

  canvas.width  = main.offsetWidth;
  canvas.height = main.offsetHeight -
    topRow.offsetHeight - botRow.offsetHeight;

  topPad = 10;
  botPad = 10;
  ROWS   = Math.max(8, cols * 2 + 4);
  rowH   = (canvas.height - topPad - botPad) / ROWS;

  /* Read actual center X of each name card relative to canvas */
  const canvasRect = canvasEl.getBoundingClientRect();
  const cards = topRow.querySelectorAll('.pname');
  colXArr = Array.from(cards).map(card => {
    const r = card.getBoundingClientRect();
    return (r.left + r.width / 2) - canvasRect.left;
  });
  /* fallback: if DOM not ready yet, use even spacing */
  if(colXArr.length === 0 || colXArr.every(x => x <= 0)){
    const sp = canvas.width * 0.08;
    const cw = (canvas.width - sp*2) / (cols-1||1);
    colXArr = Array.from({length:cols}, (_,i) => sp + i*cw);
  }
  colW = colXArr.length > 1 ? colXArr[1] - colXArr[0] : canvas.width / cols;
}

function colX(c){ return colXArr[c] !== undefined ? colXArr[c] : 0; }
function rowY(r){ return topPad  + r * rowH; }

/* ── generate rungs ── */
function generateRungs(){
  ladderRungs = [];
  /* For each row, randomly place rungs between adjacent columns — no two adjacent rungs on same row */
  for(let r=1; r<ROWS-1; r++){
    let c=0;
    while(c < cols-1){
      if(Math.random() < 0.45){
        ladderRungs.push({col:c, row:r});
        c+=2; /* skip next col to avoid adjacent rungs */
      } else { c++; }
    }
  }
  /* Guarantee every column has at least one connection to prevent straight paths */
  for(let c=0; c<cols-1; c++){
    const existing = ladderRungs.filter(r=>r.col===c);
    if(existing.length===0){
      const r = 1 + Math.floor(Math.random()*(ROWS-2));
      if(!ladderRungs.find(x=>x.row===r&&(x.col===c-1||x.col===c+1))){
        ladderRungs.push({col:c, row:r});
      }
    }
  }
}

/* ── walkers ── */
function buildWalkers(){
  walkers = players.map((_,pi) => ({
    pi,
    col:  pi,
    row:  0,
    x:    colX(pi),
    y:    rowY(0),
    going:'down',
    stepFrac: 0,
    targetX: colX(pi),
    targetY: rowY(1),
    done: false,
    won:  false,
    active: false,      /* becomes true when user clicks or ENTER */
    color: PLAYER_COLORS[pi % PLAYER_COLORS.length],
  }));
}

const PLAYER_COLORS = [
  '#f5c842','#ff6b35','#4ecdc4','#e84040','#378ADD',
  '#a855f7','#3ecf8e','#f472b6','#fb923c','#34d399',
];

/* ── build top/bottom UI ── */
function buildUI(){
  const topRow = document.getElementById('top-row');
  const botRow = document.getElementById('bot-row');
  topRow.innerHTML = '';
  botRow.innerHTML = '';

  players.forEach((p,i) => {
    const el = document.createElement('div');
    el.className = 'pname';
    el.textContent = p;
    el.dataset.pi = i;
    el.style.borderColor = walkers[i].color + '55';
    el.addEventListener('click', () => activateWalker(i));
    topRow.appendChild(el);
  });

  outcomes.forEach((o,i) => {
    const el = document.createElement('div');
    el.className = 'rname';
    el.textContent = o;
    el.dataset.ri = i;
    botRow.appendChild(el);
  });

  /* recompute layout after DOM paints (two rAFs to be safe) */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    buildLayout();
    /* reset walker positions */
    walkers.forEach((w,i) => {
      w.col=i; w.row=0; w.x=colX(i); w.y=rowY(0);
      w.going='down'; w.stepFrac=0;
      w.targetX=colX(i); w.targetY=rowY(1);
      w.done=false; w.won=false; w.active=false;
    });
    draw();
  }));
}

/* ═══════════════════════════════════════════
   ACTIVATION
═══════════════════════════════════════════ */
function activateWalker(pi){
  if (!gameRunning || gameFinished) return;
  const w = walkers[pi];
  if (w.active || w.done) return;
  w.active = true;
  const el = document.querySelector(`.pname[data-pi="${pi}"]`);
  if (el) el.classList.add('running');
}

function activateAll(){
  if (!gameRunning || gameFinished) return;
  walkers.forEach((_,i) => activateWalker(i));
}

/* ═══════════════════════════════════════════
   PATHFINDING — precompute for each col
═══════════════════════════════════════════ */
function computePath(startCol){
  let col = startCol;
  const steps = []; /* array of {fromRow, fromCol, toRow, toCol} */
  for(let row=0; row<ROWS-1; row++){
    /* check if there's a rung going RIGHT from this col at this row */
    const goRight = ladderRungs.find(r=>r.row===row && r.col===col);
    /* check if there's a rung going LEFT (rung at col-1, same row) */
    const goLeft  = ladderRungs.find(r=>r.row===row && r.col===col-1);

    if(goRight){
      steps.push({type:'horiz', fromCol:col, toCol:col+1, row});
      col = col+1;
    } else if(goLeft){
      steps.push({type:'horiz', fromCol:col, toCol:col-1, row});
      col = col-1;
    }
    steps.push({type:'vert', col, fromRow:row, toRow:row+1});
  }
  return {steps, endCol:col};
}

/* ═══════════════════════════════════════════
   GAME LOOP
═══════════════════════════════════════════ */
/* speed: pixels per second along the ladder */
function pxPerSec(){ return (20 + speedLevel*10) * (spaceDown ? 4 : 1); }

function gameLoop(ts){
  if(!gameRunning){ return; }
  if(!lastTs) lastTs = ts;
  const dt = Math.min((ts-lastTs)/1000, 0.1);
  lastTs = ts;

  /* update each walker */
  walkers.forEach(w => {
    if(!w.active || w.done) return;
    if(!w.path) {
      const r = computePath(w.col);
      w.path = r.steps;
      w.pathIdx = 0;
      w.endCol  = r.endCol;
      w.stepFrac= 0;
    }
    moveWalker(w, dt);
  });

  /* draw */
  draw();

  /* check if ALL walkers (every participant) have finished */
  if(walkers.length > 0 && walkers.every(w => w.done)){
    finishGame();
    return;
  }

  animId = requestAnimationFrame(gameLoop);
}

function moveWalker(w, dt){
  if(w.pathIdx >= w.path.length){
    w.done = true;
    const outcome = outcomes[w.endCol];
    w.won = (gameMode==='win') ? outcome==='당첨' : outcome!=='꽝';
    finalizeWalker(w);
    return;
  }
  const step = w.path[w.pathIdx];
  const dist  = step.type==='vert' ? rowH : colW;
  w.stepFrac += (pxPerSec() * dt) / dist;

  if(step.type==='vert'){
    w.x = colX(step.col);
    w.y = rowY(step.fromRow) + rowH * Math.min(w.stepFrac,1);
  } else {
    const dir = step.toCol > step.fromCol ? 1 : -1;
    w.x = colX(step.fromCol) + colW * dir * Math.min(w.stepFrac,1);
    w.y = rowY(step.row);
  }

  if(w.stepFrac >= 1){
    w.stepFrac = 0;
    w.pathIdx++;
    if(step.type==='vert'){
      w.col = step.col; w.row = step.toRow;
    } else {
      w.col = step.toCol; w.row = step.row;
    }
  }
}

function finalizeWalker(w){
  const pEl = document.querySelector(`.pname[data-pi="${w.pi}"]`);
  if(pEl){ pEl.classList.remove('running'); pEl.classList.add(w.won ? 'done-win' : 'done-lose'); }
  const rEl = document.querySelector(`.rname[data-ri="${w.endCol}"]`);
  if(rEl){ rEl.classList.add(w.won ? 'win' : 'lose'); }
}

/* ═══════════════════════════════════════════
   DRAW
═══════════════════════════════════════════ */
function draw(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawVerticals();
  drawRungs();
  drawWalkers();
}

function drawVerticals(){
  for(let c=0; c<cols; c++){
    const x = colX(c);
    ctx.beginPath();
    ctx.moveTo(x, rowY(0));
    ctx.lineTo(x, rowY(ROWS));
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 4;
    ctx.stroke();
  }
}

function drawRungs(){
  ladderRungs.forEach(r => {
    const x1 = colX(r.col);
    const x2 = colX(r.col+1);
    const y  = rowY(r.row);
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
    ctx.strokeStyle = 'rgba(255,255,255,0.30)';
    ctx.lineWidth = 4;
    ctx.stroke();
  });
}

function drawWalkers(){
  walkers.forEach(w => {
    if(!w.active) return;
    const r = Math.max(7, Math.min(12, colW * 0.18));

    /* trail */
    if(w.path && w.pathIdx > 0){
      ctx.save();
      ctx.strokeStyle = w.color + '66';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      let tc = w.pi, tr = 0;
      ctx.moveTo(colX(tc), rowY(tr));
      for(let i=0; i<Math.min(w.pathIdx, w.path.length); i++){
        const s = w.path[i];
        if(s.type==='vert'){ tc=s.col; tr=s.toRow; ctx.lineTo(colX(tc),rowY(tr)); }
        else { tc=s.toCol; ctx.lineTo(colX(tc),rowY(s.row)); }
      }
      ctx.lineTo(w.x, w.y);
      ctx.stroke();
      ctx.restore();
    }

    /* dot */
    ctx.save();
    ctx.beginPath();
    ctx.arc(w.x, w.y, r, 0, Math.PI*2);
    ctx.fillStyle = w.color;
    ctx.shadowColor = w.color;
    ctx.shadowBlur  = 12;
    ctx.fill();
    ctx.restore();

    /* name */
    ctx.save();
    ctx.font = `bold ${Math.max(9,r-1)}px 'Noto Sans KR', sans-serif`;
    ctx.fillStyle = '#0d0f1a';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(players[w.pi].substring(0,2), w.x, w.y);
    ctx.restore();
  });
}

/* ═══════════════════════════════════════════
   FINISH
═══════════════════════════════════════════ */
function finishGame(){
  gameRunning  = false;
  gameFinished = true;
  document.getElementById('help-bar').style.opacity = '0';

  /* draw final state */
  draw();

  setTimeout(() => {
    showResult();
  }, 600);
}

function showResult(){
  const overlay  = document.getElementById('result-overlay');
  const icon     = document.getElementById('res-icon');
  const title    = document.getElementById('res-title');
  const list     = document.getElementById('res-list');
  list.innerHTML = '';

  if(gameMode==='win'){
    const winners = walkers.filter(w=>w.done && w.won).map(w=>players[w.pi]);
    icon.textContent  = winners.length > 0 ? '🎊' : '😢';
    title.textContent = winners.length > 0 ? `당첨자 발표!` : '당첨 없음';
    walkers.filter(w=>w.done).sort((a,b)=>b.won-a.won).forEach(w=>{
      const item = document.createElement('div');
      item.className = `res-item${w.won?' win':''}`;
      const outcome = outcomes[w.endCol];
      item.innerHTML = `<span class="res-player" style="color:${w.color}">${players[w.pi]}</span><span class="res-arrow">→</span><span class="res-result ${w.won?'win':'lose'}">${outcome}</span>`;
      list.appendChild(item);
    });
  } else {
    icon.textContent  = '🎯';
    title.textContent = '결과 발표';
    walkers.filter(w=>w.done).forEach(w=>{
      const outcome = outcomes[w.endCol];
      const isWin   = outcome !== '꽝';
      const item = document.createElement('div');
      item.className = `res-item${isWin?' win':''}`;
      item.innerHTML = `<span class="res-player" style="color:${w.color}">${players[w.pi]}</span><span class="res-arrow">→</span><span class="res-result ${isWin?'win':'lose'}">${outcome}</span>`;
      list.appendChild(item);
    });
  }

  overlay.style.display = 'flex';
}

/* ═══════════════════════════════════════════
   KEYBOARD
═══════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if(e.code==='Space'){
    e.preventDefault();
    if(!spaceDown){ spaceDown = true; }
  }
  if(e.code==='Enter'){
    e.preventDefault();
    if(gameRunning && !gameFinished) activateAll();
  }
});
document.addEventListener('keyup', e => {
  if(e.code==='Space') spaceDown = false;
});

/* ═══════════════════════════════════════════
   UTILS
═══════════════════════════════════════════ */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

window.addEventListener('resize', () => {
  if(gameRunning || gameFinished){
    requestAnimationFrame(() => {
      buildLayout();
      draw();
    });
  }
});

/* ═══════════════ PARTICIPANT SAVE / LOAD ══════════════ */
const P_KEY = 'pbbk_groups'; /* localStorage key */

function pGetTA(){
  return document.getElementById('players-input') ||
         document.getElementById('players-ta');
}
function pLoad(){ try{ return JSON.parse(localStorage.getItem(P_KEY)||'[]'); }catch(e){ return []; } }
function pSave(){ pOpenModal(); }  /* save button opens modal with save-form pre-focused */

function pOpenModal(){
  document.getElementById('plist-modal').style.display = 'flex';
  document.getElementById('plist-name-input').focus();
  pRenderList();
}
function pCloseModal(){
  document.getElementById('plist-modal').style.display = 'none';
}

function pDoSave(){
  const nameEl = document.getElementById('plist-name-input');
  const groupName = nameEl.value.trim();
  if(!groupName){ nameEl.focus(); return; }
  const val = pGetTA().value.trim();
  if(!val){ alert('참가자를 먼저 입력하세요.'); return; }
  const groups = pLoad();
  /* overwrite if same name */
  const idx = groups.findIndex(g => g.name === groupName);
  const entry = { name: groupName, value: val, saved: new Date().toLocaleDateString('ko-KR') };
  if(idx >= 0) groups[idx] = entry; else groups.unshift(entry);
  localStorage.setItem(P_KEY, JSON.stringify(groups));
  nameEl.value = '';
  pRenderList();
}

function pRenderList(){
  const scroll = document.getElementById('plist-scroll');
  const groups = pLoad();
  if(groups.length === 0){
    scroll.innerHTML = '<div id="plist-empty">저장된 그룹이 없습니다</div>';
    return;
  }
  scroll.innerHTML = groups.map((g, i) => `
    <div class="plist-item" onclick="pSelect(${i})">
      <div class="plist-item-info">
        <div class="plist-item-name">${escHtml(g.name)}</div>
        <div class="plist-item-preview">${escHtml(g.value.substring(0,50))}${g.value.length>50?'…':''}</div>
      </div>
      <button class="plist-item-del" title="삭제" onclick="event.stopPropagation();pDel(${i})">🗑</button>
    </div>`).join('');
}

function pSelect(i){
  const groups = pLoad();
  if(!groups[i]) return;
  pGetTA().value = groups[i].value;
  pGetTA().dispatchEvent(new Event('input'));
  pCloseModal();
}

function pDel(i){
  const groups = pLoad();
  groups.splice(i, 1);
  localStorage.setItem(P_KEY, JSON.stringify(groups));
  pRenderList();
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

</script>

<!-- participant save/load modal -->
<div id="plist-modal" onclick="if(event.target===this)pCloseModal()">
  <div id="plist-box">
    <div id="plist-title">
      📋 참가자 그룹
      <button id="plist-close" onclick="pCloseModal()">×</button>
    </div>
    <div id="plist-save-row">
      <input id="plist-name-input" placeholder="그룹 이름 입력 후 저장" maxlength="20">
      <button id="plist-do-save" onclick="pDoSave()">저장</button>
    </div>
    <div id="plist-scroll">
      <div id="plist-empty">저장된 그룹이 없습니다</div>
    </div>
  </div>
</div>
</body>
</html>
