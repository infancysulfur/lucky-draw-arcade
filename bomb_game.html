<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💣 폭탄 돌리기 — 뽑기 왕국</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #0d0f1a;
      --bg2:         #131628;
      --bg3:         #1a1e35;
      --sidebar-bg:  #10121f;
      --accent:      #f5c842;
      --accent2:     #ff6b35;
      --accent3:     #4ecdc4;
      --red:         #e84040;
      --blue:        #378ADD;
      --text:        #eeeef5;
      --text-muted:  #8890b0;
      --text-faint:  #4a5070;
      --border:      rgba(255,255,255,0.07);
      --border-hover:rgba(245,200,66,0.3);
      --radius:      12px;
      --radius-lg:   16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── noise + blobs ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.35;
    }
    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(90px); pointer-events: none; z-index: 0;
      animation: blobFloat 14s ease-in-out infinite alternate;
    }
    .blob-1 { width: 420px; height: 420px; background: rgba(245,200,66,0.07); top: -80px; right: -60px; }
    .blob-2 { width: 360px; height: 360px; background: rgba(255,107,53,0.06); bottom: 60px; left: -80px; animation-delay: -6s; }
    .blob-3 { width: 260px; height: 260px; background: rgba(78,205,196,0.05); top: 35%; left: 35%; animation-delay: -10s; }
    @keyframes blobFloat {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(24px,16px) scale(1.07); }
    }

    /* ── layout ── */
    #app {
      position: relative; z-index: 1;
      display: flex;
      width: 100vw; height: 100vh;
    }

    /* ── nav bar at top of sidebar ── */
    #sidebar {
      width: 256px; min-width: 256px; height: 100%;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .sidebar-nav {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      transition: all .15s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); border-color: rgba(255,255,255,0.15); }
    .sidebar-logo {
      font-family: 'Gmarket Sans', sans-serif;
      font-size: 13px; font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }
    .sidebar-logo span { color: var(--text-muted); font-weight: 300; }

    .sidebar-body {
      flex: 1; overflow-y: auto;
      padding: 20px 18px;
      display: flex; flex-direction: column; gap: 22px;
    }
    .sidebar-body::-webkit-scrollbar { width: 4px; }
    .sidebar-body::-webkit-scrollbar-track { background: transparent; }
    .sidebar-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* sidebar title */
    .game-title-block {
      display: flex; align-items: center; gap: 10px;
    }
    .game-title-icon {
      font-size: 28px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }
    .game-title-text {
      font-family: 'Gmarket Sans', sans-serif;
      font-size: 17px; font-weight: 700;
      color: var(--text);
    }
    .game-title-sub {
      font-size: 11px; color: var(--text-muted);
      margin-top: 1px;
    }

    /* section label */
    .s-label {
      font-size: 10px; font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    /* inputs */
    textarea {
      width: 100%; font-size: 12px; padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg3);
      color: var(--text);
      resize: none; height: 68px; line-height: 1.6;
      font-family: 'Noto Sans KR', sans-serif;
      transition: border-color .15s;
    }
    textarea:focus { outline: none; border-color: rgba(245,200,66,0.4); }
    textarea::placeholder { color: var(--text-faint); }

    .num-row {
      display: flex; align-items: center; gap: 8px;
    }
    .num-row label { font-size: 12px; color: var(--text-muted); flex: 1; }
    .num-input {
      width: 60px; text-align: center;
      font-size: 14px; font-weight: 700;
      padding: 5px 4px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg3);
      color: var(--accent);
      font-family: 'Gmarket Sans', sans-serif;
      transition: border-color .15s;
    }
    .num-input:focus { outline: none; border-color: rgba(245,200,66,0.4); }
    .num-input::-webkit-inner-spin-button,
    .num-input::-webkit-outer-spin-button { opacity: 1; }
    .num-hint { font-size: 10px; color: var(--text-faint); margin-top: 4px; }

    /* toggle switch */
    .toggle-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .toggle-row label { font-size: 12px; color: var(--text-muted); cursor: pointer; }
    .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .knob {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.1); border-radius: 20px;
      cursor: pointer; transition: background .2s;
      border: 1px solid var(--border);
    }
    .switch .knob::before {
      content: ''; position: absolute;
      width: 14px; height: 14px; left: 2px; top: 2px;
      background: var(--text-muted); border-radius: 50%;
      transition: transform .2s, background .2s;
    }
    .switch input:checked + .knob { background: rgba(232,64,64,0.25); border-color: rgba(232,64,64,0.4); }
    .switch input:checked + .knob::before { transform: translateX(16px); background: var(--red); }

    /* speed badges */
    .speed-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
    .speed-badge {
      font-size: 11px; padding: 3px 9px;
      border: 1px solid var(--border); border-radius: 20px;
      background: var(--bg3); color: var(--text-muted); cursor: pointer;
      transition: all .15s;
    }
    .speed-badge:hover { border-color: rgba(55,138,221,0.4); color: var(--text); }
    .speed-badge.active { background: rgba(55,138,221,0.2); color: var(--blue); border-color: rgba(55,138,221,0.5); }

    .row { display: flex; align-items: center; gap: 8px; }
    .row .val { font-size: 12px; font-weight: 700; min-width: 36px; text-align: right; color: var(--blue); font-family: 'Gmarket Sans', sans-serif; }
    input[type=range] { flex: 1; accent-color: var(--blue); }

    /* hint pill */
    .space-hint {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      font-size: 11px; color: var(--text-muted);
    }
    .key-badge {
      font-size: 10px; font-weight: 700;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 5px; padding: 1px 6px;
      color: var(--text); font-family: 'Gmarket Sans', sans-serif;
      white-space: nowrap;
    }

    /* start button */
    #start-btn {
      width: 100%; padding: 12px;
      font-size: 14px; font-weight: 700;
      font-family: 'Gmarket Sans', sans-serif;
      background: linear-gradient(135deg, #f5c842, #ff6b35);
      color: #0d0f1a;
      border: none; border-radius: var(--radius);
      cursor: pointer; margin-top: auto;
      transition: opacity .15s, transform .1s;
      letter-spacing: -0.3px;
    }
    #start-btn:disabled {
      background: rgba(255,255,255,0.08);
      color: var(--text-faint); cursor: not-allowed;
    }
    #start-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    #start-btn:active:not(:disabled) { transform: translateY(0); }

    /* sidebar footer padding */
    .sidebar-footer { padding: 0 18px 18px; flex-shrink: 0; }

    /* ── Main canvas area ── */
    #main {
      flex: 1; height: 100%;
      position: relative;
      background: var(--bg2);
      overflow: hidden;
    }

    #canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* timer */
    #timer-display {
      position: absolute;
      top: 24px; left: 50%; transform: translateX(-50%);
      font-family: 'Gmarket Sans', sans-serif;
      font-size: 48px; font-weight: 700;
      color: var(--accent);
      background: rgba(13,15,26,0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245,200,66,0.25);
      border-radius: var(--radius-lg);
      padding: 8px 32px;
      display: none;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: -1px;
    }

    /* speed indicator */
    #speed-indicator {
      position: absolute;
      top: 24px; right: 20px;
      font-size: 12px; color: var(--text-muted);
      background: rgba(13,15,26,0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 12px;
      display: none;
      font-family: 'Gmarket Sans', sans-serif;
      transition: all .2s;
    }

    /* result overlay */
    #result-overlay {
      position: absolute; inset: 0;
      background: rgba(5,7,18,0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center; justify-content: center;
      z-index: 10;
    }
    #result-box {
      background: var(--bg2);
      border: 1px solid rgba(245,200,66,0.2);
      border-radius: var(--radius-lg);
      padding: 40px 52px;
      text-align: center; min-width: 280px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
      animation: popIn .35s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }
    #result-box .boom { font-size: 56px; margin-bottom: 10px; }
    #result-box h3 {
      font-family: 'Gmarket Sans', sans-serif;
      font-size: 18px; font-weight: 700;
      color: var(--text-muted); margin-bottom: 8px;
    }
    #result-box .losers {
      font-family: 'Gmarket Sans', sans-serif;
      font-size: 30px; font-weight: 700;
      color: var(--red);
      margin: 0 0 6px;
      text-shadow: 0 0 24px rgba(232,64,64,0.4);
    }
    #result-box .sub { font-size: 13px; color: var(--text-faint); margin-bottom: 24px; }

    .result-btns { display: flex; gap: 10px; justify-content: center; }
    #restart-btn {
      padding: 10px 28px;
      font-size: 13px; font-weight: 700;
      font-family: 'Gmarket Sans', sans-serif;
      background: linear-gradient(135deg, #f5c842, #ff6b35);
      color: #0d0f1a;
      border: none; border-radius: var(--radius); cursor: pointer;
      transition: opacity .15s;
    }
    #restart-btn:hover { opacity: 0.85; }
    #home-btn {
      padding: 10px 20px;
      font-size: 13px; font-weight: 500;
      font-family: 'Noto Sans KR', sans-serif;
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius); cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center;
      transition: all .15s;
    }
    #home-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    /* divider */
    .s-divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }
  </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div id="app">

  <!-- ── Sidebar ── -->
  <div id="sidebar">

    <!-- top nav -->
    <div class="sidebar-nav">
      <a class="back-btn" href="index.html" title="홈으로">←</a>
      <a class="sidebar-logo" href="index.html">🎲 뽑기왕국 <span>/ 폭탄</span></a>
    </div>

    <div class="sidebar-body">

      <!-- 게임 타이틀 -->
      <div class="game-title-block">
        <div class="game-title-icon">💣</div>
        <div>
          <div class="game-title-text">폭탄 돌리기</div>
          <div class="game-title-sub">들고 있으면 당첨!</div>
        </div>
      </div>

      <div class="s-divider"></div>

      <!-- 참가자 -->
      <div>
        <div class="s-label">참가자</div>
        <textarea id="players-input" placeholder="쉼표로 구분&#10;예) 철수,영희,민준">철수,영희,민준,수아,지호</textarea>
      </div>

      <!-- 폭탄 개수 -->
      <div>
        <div class="s-label">폭탄 개수</div>
        <div class="num-row">
          <label>폭탄 수</label>
          <input type="number" id="bomb-count" class="num-input" min="1" max="10" value="1">
        </div>
        <div class="num-hint" id="bomb-hint">참가자 수 − 1 이하로 입력</div>
      </div>

      <!-- 타이머 -->
      <div>
        <div class="s-label">타이머 (초)</div>
        <div class="num-row">
          <label>시간</label>
          <input type="number" id="timer-input" class="num-input" min="3" max="60" value="10">
        </div>
        <div class="num-hint">3 ~ 60초</div>
        <div class="toggle-row">
          <label class="switch">
            <input type="checkbox" id="random-toggle">
            <span class="knob"></span>
          </label>
          <label for="random-toggle">랜덤 타이머 (숨김)</label>
        </div>
      </div>

      <!-- 폭탄 속도 -->
      <div>
        <div class="s-label">폭탄 속도</div>
        <div class="speed-badges" id="speed-group">
          <div class="speed-badge" data-speed="0.8">느림</div>
          <div class="speed-badge active" data-speed="1.5">보통</div>
          <div class="speed-badge" data-speed="2.5">빠름</div>
          <div class="speed-badge" data-speed="4.0">매우 빠름</div>
        </div>
        <div class="row">
          <span style="font-size:11px;color:var(--text-faint);min-width:28px;">직접</span>
          <input type="range" id="speed-slider" min="0.3" max="6" value="1.5" step="0.1">
          <span class="val" id="speed-display">1.5x</span>
        </div>
      </div>

      <!-- spacebar hint -->
      <div class="space-hint">
        <span class="key-badge">SPACE</span>
        <span>누르고 있으면 3배속</span>
      </div>

    </div>

    <!-- start button -->
    <div class="sidebar-footer">
      <button id="start-btn">🎮 게임 시작</button>
    </div>

  </div>

  <!-- ── Main ── -->
  <div id="main">
    <canvas id="canvas"></canvas>
    <div id="timer-display">10.0</div>
    <div id="speed-indicator">속도 1.5x</div>

    <div id="result-overlay" style="display:none;">
      <div id="result-box">
        <div class="boom">💥</div>
        <h3>폭탄이 터졌어요!</h3>
        <div class="losers" id="loser-names"></div>
        <div class="sub" id="loser-sub"></div>
        <div class="result-btns">
          <button id="restart-btn">🔄 다시 하기</button>
          <a href="index.html" id="home-btn">🏠 홈으로</a>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const canvas       = document.getElementById('canvas');
  const ctx          = canvas.getContext('2d');
  const timerEl      = document.getElementById('timer-display');
  const speedInd     = document.getElementById('speed-indicator');
  const resultOverlay= document.getElementById('result-overlay');
  const loserNames   = document.getElementById('loser-names');
  const loserSub     = document.getElementById('loser-sub');
  const startBtn     = document.getElementById('start-btn');
  const restartBtn   = document.getElementById('restart-btn');
  const bombInput    = document.getElementById('bomb-count');
  const timerInput   = document.getElementById('timer-input');
  const randomToggle = document.getElementById('random-toggle');
  const playersInput = document.getElementById('players-input');
  const speedSlider  = document.getElementById('speed-slider');
  const speedDisplay = document.getElementById('speed-display');
  const bombHint     = document.getElementById('bomb-hint');

  const EMOJIS = ['🧑','👩','👦','👧','👴','👵','🧔','🧒','👱','🧕'];

  /* color palette matching dark theme */
  const C = {
    bg:         '#0d0f1a',
    bg2:        '#131628',
    bg3:        '#1a1e35',
    text:       '#eeeef5',
    textMuted:  '#8890b0',
    accent:     '#f5c842',
    red:        '#e84040',
    redFaint:   'rgba(232,64,64,0.15)',
    border:     'rgba(255,255,255,0.07)',
    borderGold: 'rgba(245,200,66,0.35)',
    nodeFill:   '#1a1e35',
    nodeStroke: 'rgba(255,255,255,0.12)',
  };

  let players = [], bombs = [], bombOwners = [], bombDirs = [], bombAnims = [];
  let animId = null, gameRunning = false, lastTime = null;
  let elapsed = 0, totalTime = 10, passSpeed = 1.5, isRandom = false;
  let spacePressed = false;
  const TURBO = 3;

  /* ── keyboard ── */
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && gameRunning && !spacePressed) {
      e.preventDefault();
      spacePressed = true;
      speedInd.textContent = '⚡ 배속 중...';
      speedInd.style.borderColor = 'rgba(232,64,64,0.5)';
      speedInd.style.color = C.red;
    }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'Space') {
      spacePressed = false;
      if (gameRunning) {
        speedInd.textContent = '속도 ' + passSpeed.toFixed(1) + 'x';
        speedInd.style.borderColor = C.border;
        speedInd.style.color = C.textMuted;
      }
    }
  });

  /* ── helpers ── */
  function getPlayers() {
    return playersInput.value.split(',').map(s => s.trim()).filter(Boolean);
  }
  function clampBombs() {
    const max = Math.max(1, getPlayers().length - 1);
    bombHint.textContent = `참가자 수 − 1 이하 (최대 ${max})`;
    bombInput.max = max;
    if (parseInt(bombInput.value) > max) bombInput.value = max;
    if (parseInt(bombInput.value) < 1)   bombInput.value = 1;
  }

  playersInput.addEventListener('input', clampBombs);
  bombInput.addEventListener('change', clampBombs);
  timerInput.addEventListener('change', () => {
    let v = parseInt(timerInput.value);
    if (isNaN(v) || v < 3) timerInput.value = 3;
    if (v > 60)            timerInput.value = 60;
  });
  randomToggle.addEventListener('change', () => {
    isRandom = randomToggle.checked;
    timerInput.disabled = isRandom;
    timerInput.style.opacity = isRandom ? '0.3' : '1';
  });
  document.getElementById('speed-group').addEventListener('click', e => {
    const btn = e.target.closest('.speed-badge');
    if (!btn) return;
    document.querySelectorAll('.speed-badge').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    passSpeed = parseFloat(btn.dataset.speed);
    speedSlider.value = passSpeed;
    speedDisplay.textContent = passSpeed.toFixed(1) + 'x';
  });
  speedSlider.addEventListener('input', () => {
    passSpeed = parseFloat(speedSlider.value);
    speedDisplay.textContent = passSpeed.toFixed(1) + 'x';
    document.querySelectorAll('.speed-badge').forEach(b => b.classList.remove('active'));
  });

  /* ── canvas ── */
  function resizeCanvas() {
    const main = document.getElementById('main');
    canvas.width  = main.offsetWidth;
    canvas.height = main.offsetHeight;
  }
  window.addEventListener('resize', () => { resizeCanvas(); if (!gameRunning) draw(null); });

  function circlePositions(n, cx, cy, r) {
    return Array.from({length:n}, (_,i) => {
      const a = (i/n)*Math.PI*2 - Math.PI/2;
      return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
    });
  }

  /* ── draw ── */
  function drawCharacter(pos, name, idx, hasBomb, exploding) {
    const r = Math.max(22, Math.min(38, canvas.width * 0.038));
    ctx.save();

    /* explosion glow */
    if (exploding) {
      const grd = ctx.createRadialGradient(pos.x, pos.y, r, pos.x, pos.y, r+36);
      grd.addColorStop(0, 'rgba(245,200,66,0.5)');
      grd.addColorStop(1, 'rgba(255,107,53,0)');
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, r+36, 0, Math.PI*2);
      ctx.fillStyle = grd;
      ctx.fill();
    }

    /* outer ring when holding bomb */
    if (hasBomb) {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, r+5, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(232,64,64,0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    /* node circle */
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, r, 0, Math.PI*2);
    ctx.fillStyle = hasBomb ? 'rgba(232,64,64,0.18)' : C.nodeFill;
    ctx.fill();
    ctx.strokeStyle = hasBomb ? 'rgba(232,64,64,0.6)' : C.nodeStroke;
    ctx.lineWidth = hasBomb ? 2 : 1;
    ctx.stroke();

    /* emoji */
    ctx.font = `${r-5}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(EMOJIS[idx % EMOJIS.length], pos.x, pos.y - 1);

    /* name */
    ctx.font = `500 ${Math.max(11, Math.round(r*0.4))}px 'Noto Sans KR', sans-serif`;
    ctx.fillStyle = hasBomb ? C.red : C.textMuted;
    ctx.fillText(name, pos.x, pos.y + r + 16);

    ctx.restore();
  }

  function drawBomb(a, b, t) {
    const x = a.x + (b.x-a.x)*t;
    const y = a.y + (b.y-a.y)*t - Math.sin(t*Math.PI)*26;

    /* shadow */
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.font = '26px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    ctx.filter = 'blur(4px)';
    ctx.fillText('💣', x+2, y+4);
    ctx.restore();

    ctx.save();
    ctx.font = '26px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💣', x, y);
    ctx.restore();
  }

  /* subtle connecting lines between players */
  function drawRing(positions) {
    if (positions.length < 2) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,8]);
    ctx.beginPath();
    positions.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function draw(explodingSet) {
    if (!canvas.width || !canvas.height) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx  = canvas.width/2;
    const cy  = canvas.height/2;
    const rad = Math.min(canvas.width, canvas.height) * 0.33;
    const pos = circlePositions(players.length, cx, cy, rad);
    const hasBombSet = new Set(bombOwners);

    drawRing(pos);
    players.forEach((p,i) =>
      drawCharacter(pos[i], p, i, hasBombSet.has(i), explodingSet && explodingSet.has(i))
    );
    bombs.forEach((b,bi) => {
      if (bombAnims[bi]==null) return;
      if (pos[b.from] && pos[b.to]) drawBomb(pos[b.from], pos[b.to], bombAnims[bi]);
    });
  }

  /* ── loop ── */
  function loop(ts) {
    if (!gameRunning) return;
    if (!lastTime) lastTime = ts||0;
    const rawDt = Math.min(((ts||0)-lastTime)/1000, 0.1);
    lastTime = ts||lastTime;
    const dt = spacePressed ? rawDt*TURBO : rawDt;
    elapsed += dt;

    if (!isRandom) {
      timerEl.textContent = Math.max(0, totalTime-elapsed).toFixed(1);
    }

    const n = players.length;
    bombs.forEach((b,bi) => {
      bombAnims[bi] += dt * passSpeed;
      if (bombAnims[bi] >= 1) {
        bombAnims[bi] = 0;
        b.from = b.to;
        b.to = ((b.to+bombDirs[bi])%n+n)%n;
        bombOwners[bi] = b.from;
        if (Math.random() < 0.15) {
          bombDirs[bi] *= -1;
          b.to = ((b.from-bombDirs[bi])%n+n)%n;
        }
      }
    });

    if (elapsed >= totalTime) { endGame(); return; }
    draw(null);
    animId = requestAnimationFrame(loop);
  }

  function endGame() {
    gameRunning = false;
    spacePressed = false;
    const finalLosers = new Set(bombOwners);
    draw(finalLosers);
    setTimeout(() => {
      const list = [...finalLosers].map(i => players[i]);
      loserNames.textContent = list.join(', ');
      loserSub.textContent = list.length > 1
        ? `${list.length}명이 폭탄을 들고 있었어요!`
        : '폭탄을 들고 있었어요!';
      resultOverlay.style.display = 'flex';
      timerEl.style.display  = 'none';
      speedInd.style.display = 'none';
      startBtn.disabled = false;
    }, 600);
  }

  function startGame() {
    resizeCanvas();
    players = getPlayers();
    if (players.length < 2) { alert('참가자를 2명 이상 입력해주세요.'); return; }
    clampBombs();
    const numBombs = Math.max(1, parseInt(bombInput.value)||1);
    totalTime = isRandom ? 5+Math.random()*25 : Math.max(3, parseInt(timerInput.value)||10);
    elapsed = 0; gameRunning = true; lastTime = null;

    const used = new Set();
    bombOwners = [];
    for (let i=0; i<numBombs; i++) {
      let s; do { s=Math.floor(Math.random()*players.length); } while(used.has(s));
      used.add(s); bombOwners.push(s);
    }
    bombs    = bombOwners.map(o => ({ from:o, to:(o+1)%players.length, dir:Math.random()<.5?1:-1 }));
    bombAnims= bombs.map(()=>0);
    bombDirs = bombs.map(b=>b.dir);

    timerEl.style.display = isRandom ? 'none' : 'block';
    if (!isRandom) timerEl.textContent = totalTime.toFixed(1);
    speedInd.textContent   = '속도 ' + passSpeed.toFixed(1) + 'x';
    speedInd.style.display = 'block';
    speedInd.style.borderColor = C.border;
    speedInd.style.color       = C.textMuted;
    resultOverlay.style.display = 'none';
    startBtn.disabled = true;
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', () => { resultOverlay.style.display='none'; startGame(); });

  /* init */
  resizeCanvas();
  players = getPlayers();
  bombOwners = [0];
  bombs = [{ from:0, to:1, dir:1 }];
  bombAnims = [0];
  clampBombs();
  draw(null);
</script>
</body>
</html>
